<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapter Reader</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #FAF9F7;
    --sidebar-bg: #F1EFE8;
    --surface: #FFFFFF;
    --accent: #D97557;
    --accent-soft: #F5EDE8;
    --text: #2C2C2A;
    --text-muted: #888780;
    --text-hint: #B4B2A9;
    --border: #D3D1C7;
    --border-soft: #E5E3DC;
    --sidebar-w: 280px;
    --header-h: 72px;
    --transition: 0.22s cubic-bezier(0.4, 0, 0.2, 1);
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }

  /* ─── SIDEBAR ─── */
  .sidebar {
    width: var(--sidebar-w);
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow: hidden;
  }

  .sidebar-header {
    padding: 0 20px;
    height: var(--header-h);
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--border);
    gap: 10px;
    flex-shrink: 0;
  }

  .book-icon {
    width: 28px;
    height: 28px;
    background: var(--accent);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .book-icon svg { width: 16px; height: 16px; }

  .sidebar-header h2 {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  /* ─── SLIDER AREA ─── */
  .slider-wrap {
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--border-soft);
    flex-shrink: 0;
  }

  .slider-label-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .slider-label {
    font-size: 11px;
    color: var(--text-hint);
    font-weight: 400;
    letter-spacing: 0.04em;
  }

  .slider-badge {
    font-size: 12px;
    font-weight: 500;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 2px 8px;
    border-radius: 20px;
    letter-spacing: 0.02em;
  }

  .chapter-range {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: var(--border);
    outline: none;
    cursor: pointer;
    position: relative;
  }

  .chapter-range::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 0 0 3px var(--accent-soft), 0 1px 4px rgba(0,0,0,0.12);
    transition: box-shadow var(--transition), transform var(--transition);
  }

  .chapter-range::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: none;
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .chapter-range:hover::-webkit-slider-thumb {
    box-shadow: 0 0 0 5px var(--accent-soft), 0 2px 8px rgba(217,117,87,0.25);
    transform: scale(1.1);
  }

  /* ─── CHAPTER LIST ─── */
  .chapter-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .chapter-list::-webkit-scrollbar { width: 4px; }
  .chapter-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .chapter-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 20px;
    cursor: pointer;
    transition: background var(--transition);
    border-left: 2.5px solid transparent;
  }

  .chapter-item:hover { background: rgba(0,0,0,0.04); }

  .chapter-item.active {
    background: var(--accent-soft);
    border-left-color: var(--accent);
  }

  .chapter-num {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-hint);
    min-width: 20px;
    letter-spacing: 0.04em;
  }

  .chapter-item.active .chapter-num { color: var(--accent); }

  .chapter-info { flex: 1; min-width: 0; }

  .chapter-name {
    font-size: 13px;
    font-weight: 400;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.4;
  }

  .chapter-item.active .chapter-name { font-weight: 500; color: var(--text); }

  .chapter-words {
    font-size: 11px;
    color: var(--text-hint);
    margin-top: 1px;
  }

  /* ─── MAIN CONTENT ─── */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .content-header {
    height: var(--header-h);
    padding: 0 48px;
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
    gap: 16px;
  }

  .chapter-tag {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    white-space: nowrap;
  }

  .header-divider {
    width: 1px;
    height: 18px;
    background: var(--border);
    flex-shrink: 0;
  }

  .chapter-title {
    font-family: 'Lora', Georgia, serif;
    font-size: 20px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }

  .progress-pill {
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
    font-weight: 400;
  }

  /* ─── SCROLL AREA ─── */
  .scroll-area {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .scroll-area::-webkit-scrollbar { width: 5px; }
  .scroll-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .chapter-body {
    max-width: 680px;
    margin: 0 auto;
    padding: 52px 48px 32px;
  }

  .chapter-body h3 {
    font-family: 'Lora', Georgia, serif;
    font-size: 28px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 8px;
    line-height: 1.3;
  }

  .chapter-meta {
    font-size: 12px;
    color: var(--text-hint);
    margin-bottom: 36px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .chapter-meta span { display: flex; align-items: center; gap: 4px; }

  .drop-cap::first-letter {
    font-family: 'Lora', Georgia, serif;
    float: left;
    font-size: 3.8em;
    line-height: 0.82;
    padding-right: 10px;
    padding-top: 4px;
    color: var(--accent);
    font-weight: 600;
  }

  .chapter-body p {
    font-family: 'Lora', Georgia, serif;
    font-size: 17.5px;
    line-height: 1.85;
    color: var(--text);
    margin-bottom: 1.6em;
    font-weight: 400;
  }

  .chapter-body p:not(:first-of-type) { text-indent: 1.5em; }

  .chapter-body blockquote {
    border-left: 3px solid var(--accent);
    padding: 4px 0 4px 24px;
    margin: 2em 0;
    font-family: 'Lora', Georgia, serif;
    font-style: italic;
    color: var(--text-muted);
    font-size: 18px;
    line-height: 1.7;
  }

  /* ─── NAV FOOTER ─── */
  .nav-footer {
    padding: 16px 48px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .nav-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 18px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 400;
    cursor: pointer;
    transition: all var(--transition);
  }

  .nav-btn:hover:not(:disabled) {
    background: var(--sidebar-bg);
    border-color: var(--text-muted);
  }

  .nav-btn:active:not(:disabled) { transform: scale(0.97); }

  .nav-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  .nav-btn svg { width: 16px; height: 16px; }

  .nav-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .nav-dots {
    display: flex;
    gap: 5px;
    align-items: center;
  }

  .nav-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--border);
    transition: all var(--transition);
    cursor: pointer;
  }

  .nav-dot.active {
    background: var(--accent);
    width: 16px;
    border-radius: 3px;
  }

  .nav-count {
    font-size: 12px;
    color: var(--text-hint);
  }

  /* ─── PAGE TRANSITION ─── */
  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .chapter-body.entering {
    animation: fadeSlideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }

  /* ─── PROGRESS BAR ─── */
  .progress-bar {
    height: 2px;
    background: var(--accent);
    transition: width 0.4s ease;
    position: absolute;
    bottom: 0;
    left: 0;
  }

  .content-header { position: relative; }

  /* ─── RANGE FILL ─── */
  .range-track { position: relative; }

  /* ─── MOBILE DRAWER OVERLAY ─── */
  .drawer-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s cubic-bezier(0.4,0,0.2,1);
  }
  .drawer-overlay.open { opacity: 1; pointer-events: all; }

  .drawer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--surface);
    border-radius: 16px 16px 0 0;
    border-top: 1px solid var(--border);
    z-index: 101;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
    max-height: 70vh;
    display: flex;
    flex-direction: column;
  }
  .drawer.open { transform: translateY(0); }

  .drawer-handle {
    width: 36px; height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 12px auto 0;
    flex-shrink: 0;
  }

  .drawer-header {
    padding: 14px 20px 10px;
    border-bottom: 1px solid var(--border-soft);
    flex-shrink: 0;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .drawer-list {
    overflow-y: auto;
    padding: 8px 0 env(safe-area-inset-bottom, 16px);
    flex: 1;
  }

  /* ─── MOBILE NAV BAR ─── */
  .mobile-nav {
    display: none;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    padding-bottom: max(10px, env(safe-area-inset-bottom, 10px));
    border-top: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
    gap: 10px;
  }

  .mob-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 48px; height: 48px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s ease;
    flex-shrink: 0;
  }
  .mob-btn:active:not(:disabled) { transform: scale(0.92); background: var(--sidebar-bg); }
  .mob-btn:disabled { opacity: 0.25; cursor: not-allowed; }
  .mob-btn svg { width: 20px; height: 20px; }

  .mob-chapter-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: transparent;
    cursor: pointer;
    transition: background 0.15s ease;
    min-width: 0;
  }
  .mob-chapter-btn:active { background: var(--sidebar-bg); }

  .mob-chapter-label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .mob-chapter-name {
    font-family: 'Lora', Georgia, serif;
    font-size: 13px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 150px;
  }

  /* ─── RESPONSIVE: MOBILE ─── */
  @media (max-width: 640px) {
    .sidebar { display: none; }
    .nav-footer { display: none; }
    .mobile-nav { display: flex; }
    .drawer-overlay { display: block; }

    .main {
      height: 100dvh;
      height: 100vh;
    }

    .content-header {
      padding: 0 16px;
      height: 56px;
      gap: 10px;
    }
    .header-divider { display: none; }
    .chapter-tag { font-size: 10px; letter-spacing: 0.07em; }
    .chapter-title { font-size: 15px; }
    .progress-pill { display: none; }

    .chapter-body {
      padding: 24px 20px 16px;
    }
    .chapter-body h3 { font-size: 22px; }
    .chapter-body p { font-size: 16px; line-height: 1.8; }
    .drop-cap::first-letter { font-size: 3em; }
  }

</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-header">
    <div class="book-icon">
      <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 2h7.5a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 10.5 14H3V2Z" stroke="white" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M10.5 14a1.5 1.5 0 0 0 0-3H3" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
        <path d="M5.5 5.5h4M5.5 8h3" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
    </div>
    <h2>Written by cocodekat</h2>
  </div>

  <div class="slider-wrap">
    <div class="slider-label-row">
      <span class="slider-label">Navigate chapters</span>
      <span class="slider-badge" id="slider-badge">Ch. 1</span>
    </div>
    <div class="range-track">
      <input type="range" class="chapter-range" id="chapter-slider" min="0" max="7" value="0" step="1">
    </div>
  </div>

  <nav class="chapter-list" id="chapter-list"></nav>
</aside>

<main class="main">
  <header class="content-header">
    <span class="chapter-tag" id="header-tag">Chapter 1</span>
    <div class="header-divider"></div>
    <h1 class="chapter-title" id="chapter-title">The Last Light of Evening</h1>
    <span class="progress-pill" id="progress-pill">1 of 8</span>
    <div class="progress-bar" id="progress-bar"></div>
  </header>

  <div class="scroll-area" id="scroll-area">
    <div class="chapter-body" id="chapter-body"></div>
  </div>

  <footer class="nav-footer">
    <button class="nav-btn" id="prev-btn">
      <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 12L6 8l4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Previous
    </button>

    <div class="nav-center">
      <div class="nav-dots" id="nav-dots"></div>
      <span class="nav-count" id="nav-count">Chapter 1 of 8</span>
    </div>

    <button class="nav-btn" id="next-btn">
      Next
      <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </footer>

  <!-- Mobile nav bar -->
  <nav class="mobile-nav" id="mobile-nav">
    <button class="mob-btn" id="mob-prev-btn" aria-label="Previous chapter">
      <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 12L6 8l4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <button class="mob-chapter-btn" id="mob-chapter-btn" aria-label="Select chapter">
      <span class="mob-chapter-label" id="mob-chapter-label">Chapter 1</span>
      <span class="mob-chapter-name" id="mob-chapter-name">Loading…</span>
    </button>

    <button class="mob-btn" id="mob-next-btn" aria-label="Next chapter">
      <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </nav>
</main>

<!-- Chapter drawer (mobile) -->
<div class="drawer-overlay" id="drawer-overlay"></div>
<div class="drawer" id="drawer" role="dialog" aria-label="Select chapter">
  <div class="drawer-handle"></div>
  <div class="drawer-header">All Chapters</div>
  <nav class="drawer-list" id="drawer-list"></nav>
</div>

<script>
const chapters = [
  {
    title: "(Prologue) It Was Just a Joke",
    words: "365 words",
    content: `
      <p class="drop-cap">I was sitting in my room, half lit by my monitor. It wasn't very big, but I liked that about it. My desk was cluttered with paper and charging cables, and the rain outside made the whole place feel smaller somehow. Water tapped against the balcony window hard enough to drown out the traffic below.</p>
      <p>I was in a call with my friends, grinding through another match while my headset charged beside me. My phone was on speaker.</p>
      <p>"Dude, just admit you have a secret sister already."</p>
      <p>"Yeah," another voice laughed, "there's no way someone acts this suspicious naturally."</p>
      <p>I rolled my eyes and kept playing. They'd been making the same stupid joke all week.</p>
      <p>My dad stopped briefly at my doorway. I only noticed because he stayed there longer than usual. Then he walked away and made a phone call.</p>
      <p>"Dude, my dad is talking about your sister," one of my friends said.</p>
      <p>I didn't pay much attention to it and kept playing.</p>
      <p>After a few more matches, I muted the call and switched on the TV. My favorite show was airing, though I barely paid attention to it. Then a message popped up from the same friend: <em>"Recorded a few minutes ago lol"</em></p>
      <p>I held my thumb over the play button, doubting that it was anything important. Still, he sent funny recordings all the time. I frowned and played it.</p>
      <p>It was a phone call. Most of the other voice was muffled.</p>
      <p>"Good, just like always. What's up?"</p>
      <p>"No, I haven't told them."</p>
      <p>"I'm sure my son just made that up. He makes up jokes a lot."</p>
      <p>My chest tightened for a few seconds. Maybe they were talking about someone else. Still — why would my dad say that?</p>
      <p>I stared at the rain running down the window. No. If I really had a sister, he would've told me.</p>
      <p>For the next few nights, I replayed the recording before going to sleep. I had a few different dreams, though they all shared the same thing — I had a sister in every one of them.</p>
      <p>I had been writing stories for a while, getting a little better each time I tried. Eventually a new idea came to me. What if the joke was real.</p>`
  },
  {
    title: "(Prologue) Reveal",
    words: "553 words",
    content: `
      <p class="drop-cap">I made the opening exactly as it had happened to me a few days ago.</p>
      <p>The next day I was supposed to come home a little later — I was going to do homework at a friend's house, though the plans got cancelled. Upon entering the house I heard that my dad had some friends over. I didn't intend on bothering them, so I headed to my room instead.</p>
      <p>That's when I heard one of them say: <em>"Wait, so he seriously didn't know? You should absolutely tell him."</em></p>
      <p>I froze near the stairs. The joke immediately came back to mind. The recording too.</p>
      <p>Even so, I decided to go into the room. I figured if it didn't concern me, they'd keep talking about it.</p>
      <p>Chairs shifted softly as I stepped in. Then everything went dead silent.</p>
      <p>After a moment they started talking again — though about something else entirely.</p>
      <p>I thought this would fit in the book. I wrote the scene almost exactly as it had happened: the silence, the way they changed the subject the second I walked in. Even while writing it down, it still felt stupid. Like I was forcing ordinary things into some dramatic story.</p>
      <p>But the more I thought about it, the less ordinary it felt.</p>
      <p>That night, I barely slept. Every time I closed my eyes, my thoughts drifted back to the kitchen — the silence when I walked in, the way everyone avoided looking at me for those first few seconds.</p>
      <p>Around three in the morning, rain started hitting the balcony window again. I ended up replaying the recording one more time before finally putting my phone down.</p>
      <p>Eventually, exhaustion pulled me to sleep.</p>
      <p>The dream picked up where the last one had ended. I was sitting at a table across from a girl I somehow recognized immediately. She looked around my age. Dark hair. A loose hoodie. Chopsticks in one hand while she complained about something with an exaggerated expression that made me laugh even in the dream.</p>
      <p>It felt strangely ordinary. Like we'd known each other for years already.</p>
      <p>When I woke up, the feeling stayed with me. Not just the dream itself — the familiarity of it.</p>
      <p>By the time I got home from school the next day, my dad was sitting alone at the kitchen table. For a moment, I almost went up the stairs without saying anything.</p>
      <p>"Dad?"</p>
      <p>"What's up?"</p>
      <p>"Is there something I don't know about? I've been getting the feeling you're hiding something from me."</p>
      <p>He looked up from his coffee and frowned slightly. "What do you mean?" I told him about the recording, the call, the kitchen.</p>
      <p>Finally he said: "I'm sorry. I should have told you earlier."</p>

    item.className = 'chapter-item' + (i === current ? ' active' : '');
    item.innerHTML = `
      <span class="chapter-num">${String(i + 1).padStart(2, '0')}</span>
      <div class="chapter-info">
        <div class="chapter-name">${ch.title}</div>
        <div class="chapter-words">${ch.words}</div>
      </div>`;
    item.addEventListener('click', () => goTo(i));
    list.appendChild(item);
  });
}

function goTo(index, skipScroll) {
  current = Math.max(0, Math.min(chapters.length - 1, index));
  setCookie('readerChapter', current, 30);

  const ch = chapters[current];
  document.getElementById('chapter-title').textContent = ch.title;
  document.getElementById('header-tag').textContent = `Chapter ${current + 1}`;
  document.getElementById('progress-pill').textContent = `${current + 1} of ${chapters.length}`;
  document.getElementById('nav-count').textContent = `Chapter ${current + 1} of ${chapters.length}`;
  document.getElementById('slider-badge').textContent = `Ch. ${current + 1}`;
  document.getElementById('chapter-slider').value = current;

  document.title = ch.title + ' — Chapter Reader';

  const body = document.getElementById('chapter-body');
  body.classList.remove('entering');
  void body.offsetWidth;
  body.innerHTML = `<h3>Chapter ${current + 1}</h3><div class="chapter-meta"><span>📖 ${ch.words}</span></div>` + ch.content;
  body.classList.add('entering');

  document.getElementById('prev-btn').disabled = current === 0;
  document.getElementById('next-btn').disabled = current === chapters.length - 1;

  const mobPrev = document.getElementById('mob-prev-btn');
  const mobNext = document.getElementById('mob-next-btn');
  if (mobPrev) mobPrev.disabled = current === 0;
  if (mobNext) mobNext.disabled = current === chapters.length - 1;

  const mobLabel = document.getElementById('mob-chapter-label');
  const mobName = document.getElementById('mob-chapter-name');
  if (mobLabel) mobLabel.textContent = `Chapter ${current + 1}`;
  if (mobName) mobName.textContent = ch.title;

  if (!skipScroll) {
    document.getElementById('scroll-area').scrollTo({ top: 0, behavior: 'smooth' });
  }

  buildList();
  updateDots();
  updateProgressBar();

  const slider = document.getElementById('chapter-range');
  if (slider) updateSliderFill(slider);
}

function updateSliderFill(el) {
  const pct = (el.value / (chapters.length - 1)) * 100;
  el.style.background = `linear-gradient(to right, var(--accent) ${pct}%, var(--border) ${pct}%)`;
}

document.addEventListener('DOMContentLoaded', () => {
  const slider = document.getElementById('chapter-slider');
  slider.max = chapters.length - 1;

  slider.addEventListener('input', () => {
    goTo(parseInt(slider.value));
    updateSliderFill(slider);
  });

  document.getElementById('prev-btn').addEventListener('click', () => goTo(current - 1));
  document.getElementById('next-btn').addEventListener('click', () => goTo(current + 1));

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') goTo(current - 1);
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') goTo(current + 1);
  });

  const saved = parseInt(getCookie('readerChapter'));
  goTo(isNaN(saved) ? 0 : saved, true);
  updateSliderFill(slider);

  // Mobile prev/next
  document.getElementById('mob-prev-btn').addEventListener('click', () => goTo(current - 1));
  document.getElementById('mob-next-btn').addEventListener('click', () => goTo(current + 1));

  // Chapter drawer open/close
  const overlay = document.getElementById('drawer-overlay');
  const drawer = document.getElementById('drawer');

  function openDrawer() {
    overlay.classList.add('open');
    drawer.classList.add('open');
    buildDrawerList();
  }

  function closeDrawer() {
    overlay.classList.remove('open');
    drawer.classList.remove('open');
  }

  document.getElementById('mob-chapter-btn').addEventListener('click', openDrawer);
  overlay.addEventListener('click', closeDrawer);

  function buildDrawerList() {
    const list = document.getElementById('drawer-list');
    list.innerHTML = '';
    chapters.forEach((ch, i) => {
      const item = document.createElement('div');
      item.className = 'chapter-item' + (i === current ? ' active' : '');
      item.innerHTML = `
        <span class="chapter-num">${String(i + 1).padStart(2, '0')}</span>
        <div class="chapter-info">
          <div class="chapter-name">${ch.title}</div>
          <div class="chapter-words">${ch.words}</div>
        </div>`;
      item.addEventListener('click', () => { goTo(i); closeDrawer(); });
      list.appendChild(item);
    });
  }
});
</script>
</body>
</html>
