<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Select a Destination</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #FAF9F7;
  --surface: #FFFFFF;
  --accent: #D97557;
  --accent-soft: #F5EDE8;
  --text: #2C2C2A;
  --text-muted: #888780;
  --text-hint: #B4B2A9;
  --border: #D3D1C7;
  --border-soft: #E5E3DC;
  --transition: 0.22s cubic-bezier(0.4, 0, 0.2, 1);
}
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 48px 24px;
}
.page-label {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-hint);
  margin-bottom: 12px;
  text-align: center;
}
.page-title {
  font-family: 'Lora', Georgia, serif;
  font-size: 32px;
  font-weight: 600;
  color: var(--text);
  text-align: center;
  margin-bottom: 8px;
}
.page-sub {
  font-size: 14px;
  color: var(--text-muted);
  text-align: center;
  margin-bottom: 48px;
}
.panels {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
  width: 100%;
  max-width: 600px;
}
.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 28px 24px 24px;
  cursor: pointer;
  text-decoration: none;
  color: inherit;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 12px;
  transition: border-color var(--transition), transform var(--transition), box-shadow var(--transition);
  position: relative;
  overflow: hidden;
}
.panel::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--accent-soft);
  opacity: 0;
  transition: opacity var(--transition);
}
.panel:hover {
  border-color: var(--accent);
  transform: translateY(-3px);
  box-shadow: 0 8px 24px rgba(217, 117, 87, 0.12);
}
.panel:hover::before { opacity: 1; }
.panel:active { transform: translateY(-1px); }
.panel-icon {
  width: 40px;
  height: 40px;
  background: var(--accent-soft);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  position: relative;
  z-index: 1;
}
.panel-icon svg {
  width: 20px;
  height: 20px;
  stroke: var(--accent);
  fill: none;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.panel-content { position: relative; z-index: 1; }
.panel-title {
  font-family: 'Lora', Georgia, serif;
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
  line-height: 1.3;
}
.panel-desc {
  font-size: 12px;
  color: var(--text-muted);
  line-height: 1.5;
}
.panel-arrow {
  margin-top: auto;
  padding-top: 16px;
  position: relative;
  z-index: 1;
}
.panel-arrow svg {
  width: 16px;
  height: 16px;
  stroke: var(--text-hint);
  fill: none;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  transition: stroke var(--transition), transform var(--transition);
}
.panel:hover .panel-arrow svg {
  stroke: var(--accent);
  transform: translateX(3px);
}
.divider {
  width: 100%;
  max-width: 600px;
  border: none;
  border-top: 1px solid var(--border-soft);
  margin: 40px 0 0;
}
.footer-note {
  font-size: 12px;
  color: var(--text-hint);
  text-align: center;
  margin-top: 16px;
}
@media (max-width: 480px) {
  .panels { grid-template-columns: 1fr; }
  .page-title { font-size: 24px; }
}
</style>
</head>
<body>

<p class="page-label">Written by cocodekat</p>
<h1 class="page-title">Where would you like to go?</h1>
<p class="page-sub">Select a destination below</p>
<div class="panels" id="panels"></div>
<hr class="divider">
<p class="footer-note">Click any panel to continue</p>

<script>
const destinations = [
  {
    title: "Story 1",
    desc: "(Romance) Read the finished version of this story.",
    href: "book1.html",
    icon: `<path d="M4 19V5a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v14"/><path d="M4 19h11"/><path d="M4 19a2 2 0 0 0 2 2h9"/><path d="M8 7h5M8 10h3"/>`
  },
  {
    title: "Story 2",
    desc: "(Unfinished) Read the ongoing chapters of this unfinished story.",
    href: "book2.html",
    icon: `<path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>`
  },
  {
    title: "About",
    desc: "Learn more about the authors and the people behind the stories.",
    href: "./about.html",
    icon: `<circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>`
  },
  {
    title: "Contact",
    desc: "Send a message or leave feedback — reaches us directly on Discord.",
    href: "https://discord.com/users/1276260542247342153",
    icon: `<path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>`
  }
];

const container = document.getElementById('panels');
destinations.forEach(d => {
  const a = document.createElement('a');
  a.href = d.href;
  a.className = 'panel';
  a.innerHTML = `
    <div class="panel-icon"><svg viewBox="0 0 24 24">${d.icon}</svg></div>
    <div class="panel-content">
      <div class="panel-title">${d.title}</div>
      <div class="panel-desc">${d.desc}</div>
    </div>
    <div class="panel-arrow"><svg viewBox="0 0 16 16"><path d="M6 4l4 4-4 4"/></svg></div>
  `;
  container.appendChild(a);
});
</script>

</body>
</html>
