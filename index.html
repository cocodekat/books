<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapter Reader</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #FAF9F7;
    --sidebar-bg: #F1EFE8;
    --surface: #FFFFFF;
    --accent: #D97557;
    --accent-soft: #F5EDE8;
    --text: #2C2C2A;
    --text-muted: #888780;
    --text-hint: #B4B2A9;
    --border: #D3D1C7;
    --border-soft: #E5E3DC;
    --sidebar-w: 280px;
    --header-h: 72px;
    --transition: 0.22s cubic-bezier(0.4, 0, 0.2, 1);
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ─── SIDEBAR ─── */
  .sidebar {
    width: var(--sidebar-w);
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow: hidden;
  }

  .sidebar-header {
    padding: 0 20px;
    height: var(--header-h);
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--border);
    gap: 10px;
    flex-shrink: 0;
  }

  .book-icon {
    width: 28px;
    height: 28px;
    background: var(--accent);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .book-icon svg { width: 16px; height: 16px; }

  .sidebar-header h2 {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  /* ─── SLIDER AREA ─── */
  .slider-wrap {
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--border-soft);
    flex-shrink: 0;
  }

  .slider-label-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .slider-label {
    font-size: 11px;
    color: var(--text-hint);
    font-weight: 400;
    letter-spacing: 0.04em;
  }

  .slider-badge {
    font-size: 12px;
    font-weight: 500;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 2px 8px;
    border-radius: 20px;
    letter-spacing: 0.02em;
  }

  .chapter-range {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: var(--border);
    outline: none;
    cursor: pointer;
    position: relative;
  }

  .chapter-range::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 0 0 3px var(--accent-soft), 0 1px 4px rgba(0,0,0,0.12);
    transition: box-shadow var(--transition), transform var(--transition);
  }

  .chapter-range::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: none;
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .chapter-range:hover::-webkit-slider-thumb {
    box-shadow: 0 0 0 5px var(--accent-soft), 0 2px 8px rgba(217,117,87,0.25);
    transform: scale(1.1);
  }

  /* ─── CHAPTER LIST ─── */
  .chapter-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .chapter-list::-webkit-scrollbar { width: 4px; }
  .chapter-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .chapter-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 20px;
    cursor: pointer;
    transition: background var(--transition);
    border-left: 2.5px solid transparent;
  }

  .chapter-item:hover { background: rgba(0,0,0,0.04); }

  .chapter-item.active {
    background: var(--accent-soft);
    border-left-color: var(--accent);
  }

  .chapter-num {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-hint);
    min-width: 20px;
    letter-spacing: 0.04em;
  }

  .chapter-item.active .chapter-num { color: var(--accent); }

  .chapter-info { flex: 1; min-width: 0; }

  .chapter-name {
    font-size: 13px;
    font-weight: 400;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.4;
  }

  .chapter-item.active .chapter-name { font-weight: 500; color: var(--text); }

  .chapter-words {
    font-size: 11px;
    color: var(--text-hint);
    margin-top: 1px;
  }

  /* ─── MAIN CONTENT ─── */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .content-header {
    height: var(--header-h);
    padding: 0 48px;
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
    gap: 16px;
  }

  .chapter-tag {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    white-space: nowrap;
  }

  .header-divider {
    width: 1px;
    height: 18px;
    background: var(--border);
    flex-shrink: 0;
  }

  .chapter-title {
    font-family: 'Lora', Georgia, serif;
    font-size: 20px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }

  .progress-pill {
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
    font-weight: 400;
  }

  /* ─── SCROLL AREA ─── */
  .scroll-area {
    flex: 1;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .scroll-area::-webkit-scrollbar { width: 5px; }
  .scroll-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .chapter-body {
    max-width: 680px;
    margin: 0 auto;
    padding: 52px 48px 32px;
  }

  .chapter-body h3 {
    font-family: 'Lora', Georgia, serif;
    font-size: 28px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 8px;
    line-height: 1.3;
  }

  .chapter-meta {
    font-size: 12px;
    color: var(--text-hint);
    margin-bottom: 36px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .chapter-meta span { display: flex; align-items: center; gap: 4px; }

  .drop-cap::first-letter {
    font-family: 'Lora', Georgia, serif;
    float: left;
    font-size: 3.8em;
    line-height: 0.82;
    padding-right: 10px;
    padding-top: 4px;
    color: var(--accent);
    font-weight: 600;
  }

  .chapter-body p {
    font-family: 'Lora', Georgia, serif;
    font-size: 17.5px;
    line-height: 1.85;
    color: var(--text);
    margin-bottom: 1.6em;
    font-weight: 400;
  }

  .chapter-body p:not(:first-of-type) { text-indent: 1.5em; }

  .chapter-body blockquote {
    border-left: 3px solid var(--accent);
    padding: 4px 0 4px 24px;
    margin: 2em 0;
    font-family: 'Lora', Georgia, serif;
    font-style: italic;
    color: var(--text-muted);
    font-size: 18px;
    line-height: 1.7;
  }

  /* ─── NAV FOOTER ─── */
  .nav-footer {
    padding: 16px 48px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .nav-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 18px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 400;
    cursor: pointer;
    transition: all var(--transition);
  }

  .nav-btn:hover:not(:disabled) {
    background: var(--sidebar-bg);
    border-color: var(--text-muted);
  }

  .nav-btn:active:not(:disabled) { transform: scale(0.97); }

  .nav-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  .nav-btn svg { width: 16px; height: 16px; }

  .nav-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .nav-dots {
    display: flex;
    gap: 5px;
    align-items: center;
  }

  .nav-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--border);
    transition: all var(--transition);
    cursor: pointer;
  }

  .nav-dot.active {
    background: var(--accent);
    width: 16px;
    border-radius: 3px;
  }

  .nav-count {
    font-size: 12px;
    color: var(--text-hint);
  }

  /* ─── PAGE TRANSITION ─── */
  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .chapter-body.entering {
    animation: fadeSlideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }

  /* ─── PROGRESS BAR ─── */
  .progress-bar {
    height: 2px;
    background: var(--accent);
    transition: width 0.4s ease;
    position: absolute;
    bottom: 0;
    left: 0;
  }

  .content-header { position: relative; }

  /* ─── RANGE FILL ─── */
  .range-track { position: relative; }

</style>
</head>

</main>

      <p class="drop-cap">I was sitting in my room, half lit by my monitor. It wasn't very big, but I liked that about it. My desk was cluttered with paper and charging cables, and the rain outside made the whole place feel smaller somehow. Water tapped against the balcony window hard enough to drown out the traffic below.</p>

      <p>"Sure, why not?" I replied after a brief pause.</p>
      <p>I moved closer and wrapped my arms around her. She held on for a long while. After a few minutes I glanced at her to figure out why she was still holding on — and found that she had fallen asleep.</p>
      <p>Since I was apparently her pillow now, I stayed there until she woke up again.</p>`
  }
];
let current = 0;

function setCookie(name, val, days) {
  const d = new Date();
  d.setTime(d.getTime() + days * 86400000);
  document.cookie = `${name}=${val};expires=${d.toUTCString()};path=/`;
}

function getCookie(name) {
  for (let c of document.cookie.split(';')) {
    const [k, v] = c.trim().split('=');
    if (k === name) return v;
  }
  return null;
}

function updateProgressBar() {
  const pct = chapters.length === 1 ? 100 : (current / (chapters.length - 1)) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';
}

function updateDots() {
  const container = document.getElementById('nav-dots');
  container.innerHTML = '';
  chapters.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.className = 'nav-dot' + (i === current ? ' active' : '');
    dot.addEventListener('click', () => goTo(i));
    container.appendChild(dot);
  });
}

function buildList() {
  const list = document.getElementById('chapter-list');
  list.innerHTML = '';
  chapters.forEach((ch, i) => {
    const item = document.createElement('div');
    item.className = 'chapter-item' + (i === current ? ' active' : '');
    item.innerHTML = `
      <span class="chapter-num">${String(i + 1).padStart(2, '0')}</span>
      <div class="chapter-info">
        <div class="chapter-name">${ch.title}</div>
        <div class="chapter-words">${ch.words}</div>
      </div>`;
    item.addEventListener('click', () => goTo(i));
    list.appendChild(item);
  });
}

function goTo(index, skipScroll) {
  current = Math.max(0, Math.min(chapters.length - 1, index));
  setCookie('readerChapter', current, 30);

  const ch = chapters[current];
  document.getElementById('chapter-title').textContent = ch.title;
  document.getElementById('header-tag').textContent = `Chapter ${current + 1}`;
  document.getElementById('progress-pill').textContent = `${current + 1} of ${chapters.length}`;
  document.getElementById('nav-count').textContent = `Chapter ${current + 1} of ${chapters.length}`;
  document.getElementById('slider-badge').textContent = `Ch. ${current + 1}`;
  document.getElementById('chapter-slider').value = current;

  document.title = ch.title + ' — Chapter Reader';

  const body = document.getElementById('chapter-body');
  body.classList.remove('entering');
  void body.offsetWidth;
  body.innerHTML = `<h3>Chapter ${current + 1}</h3><div class="chapter-meta"><span>📖 ${ch.words}</span></div>` + ch.content;
  body.classList.add('entering');

  document.getElementById('prev-btn').disabled = current === 0;
  document.getElementById('next-btn').disabled = current === chapters.length - 1;

  if (!skipScroll) {
    document.getElementById('scroll-area').scrollTo({ top: 0, behavior: 'smooth' });
  }

  buildList();
  updateDots();
  updateProgressBar();

  const slider = document.getElementById('chapter-range');
  if (slider) updateSliderFill(slider);
}

function updateSliderFill(el) {
  const pct = (el.value / (chapters.length - 1)) * 100;
  el.style.background = `linear-gradient(to right, var(--accent) ${pct}%, var(--border) ${pct}%)`;
}

document.addEventListener('DOMContentLoaded', () => {
  const slider = document.getElementById('chapter-slider');
  slider.max = chapters.length - 1;

  slider.addEventListener('input', () => {
    goTo(parseInt(slider.value));
    updateSliderFill(slider);
  });

  document.getElementById('prev-btn').addEventListener('click', () => goTo(current - 1));
  document.getElementById('next-btn').addEventListener('click', () => goTo(current + 1));

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') goTo(current - 1);
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') goTo(current + 1);
  });

  const saved = parseInt(getCookie('readerChapter'));
  goTo(isNaN(saved) ? 0 : saved, true);
  updateSliderFill(slider);
});
</script>
</body>
</html>
