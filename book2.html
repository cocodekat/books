<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book 2 - Untitled</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #FAF9F7;
    --sidebar-bg: #F1EFE8;
    --surface: #FFFFFF;
    --accent: #D97557;
    --accent-soft: #F5EDE8;
    --text: #2C2C2A;
    --text-muted: #888780;
    --text-hint: #B4B2A9;
    --border: #D3D1C7;
    --border-soft: #E5E3DC;
    --sidebar-w: 280px;
    --header-h: 72px;
    --transition: 0.22s cubic-bezier(0.4, 0, 0.2, 1);
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }

  /* ─── SIDEBAR ─── */
  .sidebar {
    width: var(--sidebar-w);
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow: hidden;
  }

  .sidebar-header {
    padding: 0 20px;
    height: var(--header-h);
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--border);
    gap: 10px;
    flex-shrink: 0;
  }

  .book-icon {
    width: 28px;
    height: 28px;
    background: var(--accent);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .book-icon svg { width: 16px; height: 16px; }

  .sidebar-header h2 {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  /* ─── SLIDER AREA ─── */
  .slider-wrap {
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--border-soft);
    flex-shrink: 0;
  }

  .slider-label-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .slider-label {
    font-size: 11px;
    color: var(--text-hint);
    font-weight: 400;
    letter-spacing: 0.04em;
  }

  .slider-badge {
    font-size: 12px;
    font-weight: 500;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 2px 8px;
    border-radius: 20px;
    letter-spacing: 0.02em;
  }

  .chapter-range {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: var(--border);
    outline: none;
    cursor: pointer;
    position: relative;
  }

  .chapter-range::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 0 0 3px var(--accent-soft), 0 1px 4px rgba(0,0,0,0.12);
    transition: box-shadow var(--transition), transform var(--transition);
  }

  .chapter-range::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: none;
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .chapter-range:hover::-webkit-slider-thumb {
    box-shadow: 0 0 0 5px var(--accent-soft), 0 2px 8px rgba(217,117,87,0.25);
    transform: scale(1.1);
  }

  /* ─── CHAPTER LIST ─── */
  .chapter-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .chapter-list::-webkit-scrollbar { width: 4px; }
  .chapter-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .chapter-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 20px;
    cursor: pointer;
    transition: background var(--transition);
    border-left: 2.5px solid transparent;
  }

  .chapter-item:hover { background: rgba(0,0,0,0.04); }

  .chapter-item.active {
    background: var(--accent-soft);
    border-left-color: var(--accent);
  }

  .chapter-num {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-hint);
    min-width: 20px;
    letter-spacing: 0.04em;
  }

  .chapter-item.active .chapter-num { color: var(--accent); }

  .chapter-info { flex: 1; min-width: 0; }

  .chapter-name {
    font-size: 13px;
    font-weight: 400;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.4;
  }

  .chapter-item.active .chapter-name { font-weight: 500; color: var(--text); }

  .chapter-words {
    font-size: 11px;
    color: var(--text-hint);
    margin-top: 1px;
  }

  /* ─── MAIN CONTENT ─── */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .content-header {
    height: var(--header-h);
    padding: 0 48px;
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
    gap: 16px;
  }

  .chapter-tag {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    white-space: nowrap;
  }

  .header-divider {
    width: 1px;
    height: 18px;
    background: var(--border);
    flex-shrink: 0;
  }

  .chapter-title {
    font-family: 'Lora', Georgia, serif;
    font-size: 20px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }

  .progress-pill {
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
    font-weight: 400;
  }

  /* ─── SCROLL AREA ─── */
  .scroll-area {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .scroll-area::-webkit-scrollbar { width: 5px; }
  .scroll-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .chapter-body {
    max-width: 680px;
    margin: 0 auto;
    padding: 52px 48px 32px;
  }

  .chapter-body h3 {
    font-family: 'Lora', Georgia, serif;
    font-size: 28px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 8px;
    line-height: 1.3;
  }

  .chapter-meta {
    font-size: 12px;
    color: var(--text-hint);
    margin-bottom: 36px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .chapter-meta span { display: flex; align-items: center; gap: 4px; }

  .drop-cap::first-letter {
    font-family: 'Lora', Georgia, serif;
    float: left;
    font-size: 3.8em;
    line-height: 0.82;
    padding-right: 10px;
    padding-top: 4px;
    color: var(--accent);
    font-weight: 600;
  }

  .chapter-body p {
    font-family: 'Lora', Georgia, serif;
    font-size: 17.5px;
    line-height: 1.85;
    color: var(--text);
    margin-bottom: 1.6em;
    font-weight: 400;
  }

  .chapter-body p:not(:first-of-type) { text-indent: 1.5em; }

  .chapter-body blockquote {
    border-left: 3px solid var(--accent);
    padding: 4px 0 4px 24px;
    margin: 2em 0;
    font-family: 'Lora', Georgia, serif;
    font-style: italic;
    color: var(--text-muted);
    font-size: 18px;
    line-height: 1.7;
  }

  /* ─── NAV FOOTER ─── */
  .nav-footer {
    padding: 16px 48px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .nav-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 18px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 400;
    cursor: pointer;
    transition: all var(--transition);
  }

  .nav-btn:hover:not(:disabled) {
    background: var(--sidebar-bg);
    border-color: var(--text-muted);
  }

  .nav-btn:active:not(:disabled) { transform: scale(0.97); }

  .nav-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  .nav-btn svg { width: 16px; height: 16px; }

  .nav-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .nav-dots {
    display: flex;
    gap: 5px;
    align-items: center;
  }

  .nav-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--border);
    transition: all var(--transition);
    cursor: pointer;
  }

  .nav-dot.active {
    background: var(--accent);
    width: 16px;
    border-radius: 3px;
  }

  .nav-count {
    font-size: 12px;
    color: var(--text-hint);
  }

  /* ─── PAGE TRANSITION ─── */
  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .chapter-body.entering {
    animation: fadeSlideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }

  /* ─── PROGRESS BAR ─── */
  .progress-bar {
    height: 2px;
    background: var(--accent);
    transition: width 0.4s ease;
    position: absolute;
    bottom: 0;
    left: 0;
  }

  .content-header { position: relative; }

  /* ─── RANGE FILL ─── */
  .range-track { position: relative; }

  /* ─── MOBILE DRAWER OVERLAY ─── */
  .drawer-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s cubic-bezier(0.4,0,0.2,1);
  }
  .drawer-overlay.open { opacity: 1; pointer-events: all; }

  .drawer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--surface);
    border-radius: 16px 16px 0 0;
    border-top: 1px solid var(--border);
    z-index: 101;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
    max-height: 70vh;
    display: flex;
    flex-direction: column;
  }
  .drawer.open { transform: translateY(0); }

  .drawer-handle {
    width: 36px; height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 12px auto 0;
    flex-shrink: 0;
  }

  .drawer-header {
    padding: 14px 20px 10px;
    border-bottom: 1px solid var(--border-soft);
    flex-shrink: 0;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .drawer-list {
    overflow-y: auto;
    padding: 8px 0 env(safe-area-inset-bottom, 16px);
    flex: 1;
  }

  /* ─── MOBILE NAV BAR ─── */
  .mobile-nav {
    display: none;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    padding-bottom: max(10px, env(safe-area-inset-bottom, 10px));
    border-top: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
    gap: 10px;
  }

  .mob-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 48px; height: 48px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s ease;
    flex-shrink: 0;
  }
  .mob-btn:active:not(:disabled) { transform: scale(0.92); background: var(--sidebar-bg); }
  .mob-btn:disabled { opacity: 0.25; cursor: not-allowed; }
  .mob-btn svg { width: 20px; height: 20px; }

  .mob-chapter-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: transparent;
    cursor: pointer;
    transition: background 0.15s ease;
    min-width: 0;
  }
  .mob-chapter-btn:active { background: var(--sidebar-bg); }

  .mob-chapter-label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .mob-chapter-name {
    font-family: 'Lora', Georgia, serif;
    font-size: 13px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 150px;
  }

  /* ─── RESPONSIVE: MOBILE ─── */
  @media (max-width: 640px) {
    .sidebar { display: none; }
    .nav-footer { display: none; }
    .mobile-nav { display: flex; }
    .drawer-overlay { display: block; }

    .main {
      height: 100vh;        /* fallback for very old browsers */
      height: 100dvh;       /* overrides with dynamic viewport height */
      max-height: 100dvh;
    }

    .content-header {
      padding: 0 16px;
      height: 56px;
      gap: 10px;
    }
    .header-divider { display: none; }
    .chapter-tag { font-size: 10px; letter-spacing: 0.07em; }
    .chapter-title { font-size: 15px; }
    .progress-pill { display: none; }

    .chapter-body {
      padding: 24px 20px 16px;
    }
    .chapter-body h3 { font-size: 22px; }
    .chapter-body p { font-size: 16px; line-height: 1.8; }
    .drop-cap::first-letter { font-size: 3em; }
  }

  .book-title-tag {
    font-family: 'Lora', Georgia, serif;
    font-size: 13px;
    font-style: italic;
    font-weight: 400;
    color: var(--text-muted);
    white-space: nowrap;
    flex-shrink: 0;
  }

</style>
</head>

<aside class="sidebar">
  <div class="sidebar-header">
    <div class="book-icon">
      <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 2h7.5a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 10.5 14H3V2Z" stroke="white" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M10.5 14a1.5 1.5 0 0 0 0-3H3" stroke="white" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Mobile nav bar -->
  <nav class="mobile-nav" id="mobile-nav">
    <button class="mob-btn" id="mob-prev-btn" aria-label="Previous chapter">
      <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">

      </svg>
    </button>
  </nav>
</main>

<!-- Chapter drawer (mobile) -->
<div class="drawer-overlay" id="drawer-overlay"></div>
<div class="drawer" id="drawer" role="dialog" aria-label="Select chapter">
  <div class="drawer-handle"></div>
  <div class="drawer-header">All Chapters</div>
  <nav class="drawer-list" id="drawer-list"></nav>
</div>

    title: "Chapter 1 (Prolouge)",
    words: "726 words",
    content: `
    <p class="drop-cap">It was another usual school day. Rain tapped softly against the windows as it was storming outside. I sat near the back of the classroom with four of my friends, our desks pushed together for yet another group project. Notebooks and pencils were scattered across the desks. Someone was absentmindedly spinning a pen while the other was scrolling trough chemistry websites pretending to participate. We had been friends for a few years already, and we partnered up for every group project, getting a good grade every time. We had been told to research a chemical reaction of our choice. Nobody was particularly excited about it.</p>

<p>"Can we just do the elephant toothpaste thing?" Kaito asked, leaning back so far in his chair that it looked like he was testing gravity. Across from him, Ren sighed. "That's not even chemistry anymore. Besides, every group does that."</p>

<p>The classroom itself was way larger than it had to be. Empty rows of desks stretched toward the front, leaving wide gaps of unused space between groups. I glanced out the window for a moment. Water trickled down the glass in uneven streams, blurring the view of the courtyard outside. A few students hurried across it with jackets over their heads.</p>

<p>We sat in silence for a while</p>

<p>"Why is there an extra chair?" Aoi mentioned. "What are you talking about?" Kaito asked. "There's an extra chair, right there. Has it always been there?" "You're hallucinating" I said. I couldn't see what she was talking about. 30 students, 30 chairs. "I don't see it either" Ren said. "Whatever you're trying, it won't work." Yūto added. "I'm not trying anything, I promise!" "Yeah right" I said. She was always trying to mess with us.</p>

<p>There was a short silence after that.</p>

<p>Aoi didn’t look convinced. She leaned slightly forward, staring at the space between the desks like she expected the chair to appear again if she focused hard enough.</p>

<p>Kaito followed her gaze. “Where exactly?” “Right there,” she said again, slower this time. “Between Yūto and the wall.”</p>

<p>We all looked. There was nothing there. Just empty floor, faintly reflecting the light coming from the windows. Ren shrugged. “There’s literally nothing. You’re probably just tired.” “Or bored,” Yūto added.</p>

<p>Aoi opened her mouth, then closed it again. She looked annoyed, but also unsure now, like the certainty had slipped out of her hands.</p>

<p>I almost said something, but stopped. For a moment, I thought I saw it too—just a flicker, like the air was slightly denser in that spot. But when I focused, it was gone.</p>

<p>Probably nothing.</p>

<p>The teacher walked past our group without even glancing at us, like the conversation hadn’t happened at all.</p>

<p>“Alright,” she said from the front of the room. “You should be finalizing your topic by now.”</p>

<p>Kaito groaned. “We still haven’t even picked one.”</p>

<p>Ren tapped his pencil against the desk. “Why don't we make something like salt from scratch.”</p>

<p>"Is that even doable?" Aoi asked. "With all the things that could go wrong..."</p>

<p>--- We could hear the sound of the clock ticking as time slowly passed. We were in a protected lab as Yūto was mixing sodium with chlorine, which was an extremely dangerous process. The room wasn't that big, but also not so small. It was completely wrapped in some white material, which made sure that if anything went wrong, everything outside of the room would be protected. There was one window, with an older man standing in front of it, who kept checking on us. He was a supervisor, which we needed as everything here could go wrong.</p>

<p>"Done" Yūto said after a while. Somehow, the chemistry guy had pulled it off. We all took a bite of the newly created table salt, which tasted incredibly close to the kind you would get in stores.</p>

<p>"You actually did it." The man in suit outside said. He was frowning, but was clearly impressed. After a few seconds the teacher came in. She had a frown on her face of disbelief, before accepting it and walking away.</p>

<p>After relaxing for a while Aoi showed up with some drinks and snacks. "Finally, you came." Kaito said. "Took you long enough." Yūto said. "It was hard to find the good stuff alright!" Aoi said, clearly annoyed. "Alright, well just place them here." I added.</p>
    `

    title: "Chapter 2 (Prolouge)",

    <p class="drop-cap">After school we all went on a walk, before going to the café for lunch. "We're definitely getting an A for that" Jack said, clearly excited. "I think so too" Yūto added. We talked for a while, but most part was just everyone goofing off.</p>

let current = 0;

function setCookie(name, val, days) {
  const d = new Date();
  d.setTime(d.getTime() + days * 86400000);
  document.cookie = `${name}=${val};expires=${d.toUTCString()};path=/`;
}

function getCookie(name) {
  for (let c of document.cookie.split(';')) {
    const [k, v] = c.trim().split('=');
    if (k === name) return v;
  }
  return null;
}

function updateProgressBar() {
  const pct = chapters.length === 1 ? 100 : (current / (chapters.length - 1)) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';
}

function updateDots() {
  const container = document.getElementById('nav-dots');
  container.innerHTML = '';
  chapters.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.className = 'nav-dot' + (i === current ? ' active' : '');
    dot.addEventListener('click', () => goTo(i));
    container.appendChild(dot);
  });
}

function buildList() {
  const list = document.getElementById('chapter-list');
  list.innerHTML = '';
  chapters.forEach((ch, i) => {
    const item = document.createElement('div');
    item.className = 'chapter-item' + (i === current ? ' active' : '');
    item.innerHTML = `
      <span class="chapter-num">${String(i + 1).padStart(2, '0')}</span>
      <div class="chapter-info">
        <div class="chapter-name">${ch.title}</div>
        <div class="chapter-words">${ch.words}</div>
      </div>`;
    item.addEventListener('click', () => goTo(i));
    list.appendChild(item);
  });
}

function goTo(index, skipScroll) {
  current = Math.max(0, Math.min(chapters.length - 1, index));
  setCookie('readerChapter', current, 30);

  const ch = chapters[current];
  document.getElementById('chapter-title').textContent = ch.title;
  document.getElementById('header-tag').textContent = `Chapter ${current + 1}`;
  document.getElementById('progress-pill').textContent = `${current + 1} of ${chapters.length}`;
  document.getElementById('nav-count').textContent = `Chapter ${current + 1} of ${chapters.length}`;
  document.getElementById('slider-badge').textContent = `Ch. ${current + 1}`;
  document.getElementById('chapter-slider').value = current;

  document.title = ch.title + ' — unfinished story';

  const body = document.getElementById('chapter-body');
  body.classList.remove('entering');
  void body.offsetWidth;
  body.innerHTML = `<h3>Chapter ${current + 1}</h3><div class="chapter-meta"><span>📖 ${ch.words}</span></div>` + ch.content;
  body.classList.add('entering');

  document.getElementById('prev-btn').disabled = current === 0;
  document.getElementById('next-btn').disabled = current === chapters.length - 1;

  const mobPrev = document.getElementById('mob-prev-btn');
  const mobNext = document.getElementById('mob-next-btn');
  if (mobPrev) mobPrev.disabled = current === 0;
  if (mobNext) mobNext.disabled = current === chapters.length - 1;

  const mobLabel = document.getElementById('mob-chapter-label');
  const mobName = document.getElementById('mob-chapter-name');
  if (mobLabel) mobLabel.textContent = `Chapter ${current + 1}`;
  if (mobName) mobName.textContent = ch.title;

  if (!skipScroll) {
    document.getElementById('scroll-area').scrollTo({ top: 0, behavior: 'smooth' });
  }

  buildList();
  updateDots();
  updateProgressBar();

  const slider = document.getElementById('chapter-range');
  if (slider) updateSliderFill(slider);
}

function updateSliderFill(el) {
  const pct = (el.value / (chapters.length - 1)) * 100;
  el.style.background = `linear-gradient(to right, var(--accent) ${pct}%, var(--border) ${pct}%)`;
}

document.addEventListener('DOMContentLoaded', () => {
  const slider = document.getElementById('chapter-slider');
  slider.max = chapters.length - 1;

  slider.addEventListener('input', () => {
    goTo(parseInt(slider.value));
    updateSliderFill(slider);
  });

  document.getElementById('prev-btn').addEventListener('click', () => goTo(current - 1));
  document.getElementById('next-btn').addEventListener('click', () => goTo(current + 1));

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') goTo(current - 1);
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') goTo(current + 1);
  });

  const saved = parseInt(getCookie('readerChapter'));
  goTo(isNaN(saved) ? 0 : saved, true);
  updateSliderFill(slider);

  // Mobile prev/next
  document.getElementById('mob-prev-btn').addEventListener('click', () => goTo(current - 1));
  document.getElementById('mob-next-btn').addEventListener('click', () => goTo(current + 1));

  // Chapter drawer open/close
  const overlay = document.getElementById('drawer-overlay');
  const drawer = document.getElementById('drawer');

  function openDrawer() {
    overlay.classList.add('open');
    drawer.classList.add('open');
    buildDrawerList();
  }

  function closeDrawer() {
    overlay.classList.remove('open');
    drawer.classList.remove('open');
  }

  document.getElementById('mob-chapter-btn').addEventListener('click', openDrawer);
  overlay.addEventListener('click', closeDrawer);

  function buildDrawerList() {
    const list = document.getElementById('drawer-list');
    list.innerHTML = '';
    chapters.forEach((ch, i) => {
      const item = document.createElement('div');
      item.className = 'chapter-item' + (i === current ? ' active' : '');
      item.innerHTML = `
        <span class="chapter-num">${String(i + 1).padStart(2, '0')}</span>
        <div class="chapter-info">
          <div class="chapter-name">${ch.title}</div>
          <div class="chapter-words">${ch.words}</div>
        </div>`;
      item.addEventListener('click', () => { goTo(i); closeDrawer(); });
      list.appendChild(item);
    });
  }
});
